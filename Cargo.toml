[package]
name = "daymatter_astrobox_v2_plugin"
version = "3.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.62.0", features = ["async", "inter-task-wakeup"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
waki = "=0.5.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
